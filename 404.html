<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Mewmori</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" hreflang="ru" href="https://mewmori.com/404.html">
<link rel="alternate" hreflang="en" href="https://mewmori.com/en/404.html">
</head>
<body>

<a class="skip-link" href="#main-content">К содержанию</a>

<header class="site">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/icon.png" alt=""> Mewmori</a>
    <nav class="lang" style="margin-left:auto" aria-label="Выбор языка">
      <a href="/" data-lang="ru" lang="ru">RU</a><span aria-hidden="true">/</span><a href="/en/" data-lang="en" lang="en">EN</a>
    </nav>
  </div>
</header>

<main id="main-content" class="wrap hero" tabindex="-1">
  <img class="cat-hero" src="/assets/cats/black_cat.png" alt="">
  <h1>404</h1>
  <p class="lead" id="not-found-lead">Кот утащил эту страницу под диван.</p>
  <div class="buttons"><a class="button" id="not-found-home" href="/">На главную</a></div>
</main>

<script>
(function () {
  if (location.pathname.indexOf('/en/') !== 0) return;
  document.documentElement.lang = 'en';
  document.title = 'Page not found — Mewmori';
  var skip = document.querySelector('.skip-link');
  if (skip) skip.textContent = 'Skip to content';
  var lead = document.getElementById('not-found-lead');
  if (lead) lead.textContent = 'The cat dragged this page under the sofa.';
  var home = document.getElementById('not-found-home');
  if (home) {
    home.textContent = 'Go home';
    home.setAttribute('href', '/en/');
  }
})();
</script>
<script src="/assets/src.js" defer></script>
</body>
</html>
